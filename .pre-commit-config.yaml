# scikit-learn (a dependency of the mypy hook) has no wheels for the newest Python
default_language_version:
  python: python3.14

repos:
  - repo: https://github.com/asottile/pyupgrade
    rev: v3.22.0
    hooks:
      - id: pyupgrade
        args: [--py310-plus]

  - repo: https://github.com/PyCQA/isort
    rev: 10.0.0b1
    hooks:
      - id: isort

  - repo: https://github.com/psf/black
    rev: 26.10.1
    hooks:
      - id: black
        language: python

  - repo: https://github.com/pycqa/flake8
    rev: 7.4.1
    hooks:
      - id: flake8
        name: flake8
        entry: flake8 --config tox.ini
        language: python
        additional_dependencies:
          - flake8-comprehensions ~= 3.16
        types: [ python ]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-json
      - id: check-xml
      - id: check-yaml
        language: python
        exclude: condabuild/meta.yaml

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.0
    hooks:
      - id: mypy
        files: src|sphinx|test
        language: python
        additional_dependencies:
          - numpy~=2.2
          - gamma-pytools~=3.0
          - sklearndf~=2.4
